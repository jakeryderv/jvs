[project]
name = "jvs"
version = "0.0.1"
description = "Placeholder release reserving the jvs package name."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }]
dependencies = [
    "cyclopts>=3.24.0",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
jvs = "jvs._cli.app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
