[project]
name = "jvs"
version = "0.0.1"
description = "Placeholder release reserving the jvs package name."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }]
dependencies = [
  "cyclopts>=3.24.0",
  "ipykernel>=7.4.0",
  "ipython>=9.17.1",
  "jupyter>=1.1.1",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "plotly>=7.1.0",
  "prompt-toolkit>=3.0.52",
  "rich>=15.0.0",
  "seaborn>=0.13.2",
  "textual>=8.2.8",
]

[project.scripts]
jvs = "jvs._cli.app:main"

[dependency-groups]
dev = [
  "pre-commit>=4.6.2",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
  "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["-ra", "--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "E",  # Style errors
  "F",  # Undefined names, unused imports, etc.
  "I",  # Import sorting
  "UP",  # Modern Python idioms
  "B",  # Likely bugs
  "SIM",  # Simplification suggestions
  "RUF",  # Ruff-specific checks
]
ignore = [
  "E501",  # Let the formatter handle line wrapping
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-platform = "all"
